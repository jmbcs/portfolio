name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    name: validate html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .

  links:
    # Scheduled and manual only — third-party downtime should not block a PR
    name: check links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with 999
          args: >-
            --no-progress
            --exclude-mail
            --exclude linkedin\.com
            index.html README.md
          fail: true
